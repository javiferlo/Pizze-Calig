<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzeria Vila de Càlig - Carta Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero-header">
      <div class="hero-overlay">
        <img class="hero-logo" src="imagenes/Logo Pizzeria.png" alt="Pizzeria Vila de Càlig" />
        <h1>Pizzeria Vila de Càlig</h1>
        <p>La Nostra Carta</p>
      </div>
    </header>

    <main class="container" id="app"></main>

    <script src="menu-data.js"></script>
    <script>
      const app = document.getElementById("app");

      const escapeHtml = (value) =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");

      const renderAlergenos = (icons, className = "alergenos") =>
        `<div class="${className}">${icons
          .map((icon) => `<span>${escapeHtml(icon)}</span>`)
          .join("")}</div>`;

      const renderItem = (item) => {
        const parts = [
          `<div class="menu-item" id="${escapeHtml(item.id)}">`,
          `<div class="item-header">`,
          `<span class="item-name">${escapeHtml(item.name)}</span>`,
          `<span class="item-price">${escapeHtml(item.price || "")}</span>`,
          `</div>`,
        ];

        if (item.image) {
          parts.push(
            `<div class="item-photo"><img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}" loading="lazy" /></div>`,
          );
        }

        if (item.allergens?.length) {
          parts.push(renderAlergenos(item.allergens));
        }

        if (item.desc) {
          parts.push(`<div class="item-description">${escapeHtml(item.desc)}`);

          if (item.traces?.length) {
            parts.push(renderAlergenos(item.traces, "alergenos-trazas"));
          }

          parts.push(`</div>`);
        } else if (item.traces?.length) {
          parts.push(renderAlergenos(item.traces, "alergenos-trazas"));
        }

        parts.push(`</div>`);
        return parts.join("");
      };

      const renderSupplements = (supplements = []) =>
        supplements
          .map(
            (supplement, index) =>
              `${index ? '<span class="separator">|</span>' : ""}<span id="${escapeHtml(supplement.id)}">${escapeHtml(supplement.label)}: <strong>${escapeHtml(supplement.price)}</strong></span>`,
          )
          .join("");

      const renderSection = (section) => {
        const note = section.note
          ? `<div class="menu-note"><p>${escapeHtml(section.note.text)}${section.note.allergens?.length ? `<span class="alergenos inline-alergenos">${section.note.allergens.map((icon) => `<span>${escapeHtml(icon)}</span>`).join("")}</span>` : ""}</p>${section.supplements?.length ? `<div class="suplementos">${renderSupplements(section.supplements)}</div>` : ""}</div>`
          : "";

        return `<section class="menu-section${section.active ? " active" : ""}">
          <div class="section-header" onclick="toggleSection(this)">
            <h2 class="section-title">${escapeHtml(section.title)}</h2>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="section-content">
            <div class="section-content-inner">
              ${note}
              <div class="menu-grid">
                ${section.items.map(renderItem).join("")}
              </div>
            </div>
          </div>
        </section>`;
      };

      const renderPage = () => {
        app.innerHTML = `
          <div class="menu-note top-note">
            <p id="plato117996">${escapeHtml(menuData.topNote.iva)}</p>
            <p id="plato548598">${escapeHtml(menuData.topNote.alergenos)}</p>
            <div class="leyenda-alergenos">
              ${menuData.legend
                .map(
                  ([icon, label]) =>
                    `<span><span class="alergeno-icon">${escapeHtml(icon)}</span> ${escapeHtml(label)}</span>`,
                )
                .join("")}
            </div>
          </div>
          ${menuData.sections.map(renderSection).join("")}
          <footer>
            <div class="footer-content">
              <h3>${escapeHtml(menuData.footer.name)}</h3>
              <p>${escapeHtml(menuData.footer.address)}</p>
            </div>
          </footer>
        `;
      };

      function toggleSection(headerElement) {
        const currentSection = headerElement.parentElement;
        const isActive = currentSection.classList.contains("active");

        if (!isActive) {
          currentSection.classList.add("active");
        } else {
          currentSection.classList.remove("active");
        }
      }

      renderPage();
    </script>
  </body>
</html>
