<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzeria Vila de Càlig - Carta Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="lang-switcher">
      <button id="lang-toggle" class="lang-btn" onclick="toggleLang()">
        ES
      </button>
    </div>

    <header class="hero-header">
      <div class="hero-overlay">
        <img
          class="hero-logo"
          src="imagenes/Logo Pizzeria.png"
          alt="Pizzeria Vila de Càlig"
        />
        <h1>Pizzeria Vila de Càlig</h1>
        <p>La Nostra Carta</p>
      </div>
    </header>

    <main class="container" id="app"></main>
    <script src="xlsx.min.js"></script>
    <script>
      const config = {
        es: {
          iva: "IVA incluido en los precios.",
          alergenos:
            "Información adicional de alérgenos preguntar al personal.",
          ubicacion: "Ubicación y Contacto",
          horarioTitle: "Horario",
          horario1: "Jue a Dom: 19:00–22:30 | Vie a Dom: 12:00–15:30",
          horario2: "Lunes, martes y miércoles: Cerrado",
        },
        en: {
          iva: "VAT included in all prices.",
          alergenos:
            "For additional allergen information, please ask the staff.",
          ubicacion: "Location & Contact",
          horarioTitle: "Opening Hours",
          horario1: "Thu to Sun: 19:00–22:30 | Fri to Sun: 12:00–15:30",
          horario2: "Monday, Tuesday, and Wednesday: Closed",
        },
      };

      const legend = {
        es: [
          ["🌾", "Gluten"],
          ["🥛", "Lácteos"],
          ["🦐", "Crustáceos"],
          ["🐟", "Pescado"],
          ["🌱", "Soja"],
          ["🥚", "Huevo"],
          ["🦑", "Moluscos"],
          ["🟡", "Mostaza"],
        ],
        en: [
          ["🌾", "Gluten"],
          ["🥛", "Dairy"],
          ["🦐", "Crustaceans"],
          ["🐟", "Fish"],
          ["🌱", "Soy"],
          ["🥚", "Egg"],
          ["🦑", "Molluscs"],
          ["🟡", "Mustard"],
        ],
      };

      const sectionNotes = {
        Pizzas: {
          text_es:
            "Todas nuestras pizzas se elaboran con base de tomate, mozzarella y especias.",
          text_en:
            "All our pizzas are made with a tomato base, mozzarella, and spices.",
          allergens: ["🌾", "🥛"],
          supplements_es: [
            { label: "Masa sin gluten", price: "+2,00€" },
            { label: "Suplemento ingrediente", price: "+1,20€" },
            { label: "Suplemento Foie / Anchoas", price: "+2,00€" },
          ],
          supplements_en: [
            { label: "Gluten-free dough", price: "+2,00€" },
            { label: "Extra ingredient", price: "+1,20€" },
            { label: "Foie / Anchovies supplement", price: "+2,00€" },
          ],
        },
      };

      const app = document.getElementById("app");
      let currentLang = "es";
      let menuData = [];

      const escapeHtml = (value) =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");

      const getArray = (str) =>
        (str || "")
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);

      const t = (item, baseField) => {
        if (currentLang === "en" && item[`${baseField}_en`])
          return item[`${baseField}_en`];
        return item[baseField] || item[`${baseField}_es`] || "";
      };

      function toggleSection(headerElement) {
        headerElement.parentElement.classList.toggle("active");
      }

      function toggleLang() {
        currentLang = currentLang === "es" ? "en" : "es";
        document.getElementById("lang-toggle").textContent =
          currentLang.toUpperCase();
        renderMenu();
      }

      const renderAlergenos = (icons, className = "alergenos") =>
        icons.length
          ? `<div class="${className}">${icons.map((icon) => `<span data-allergen="${escapeHtml(icon)}">${escapeHtml(icon)}</span>`).join("")}</div>`
          : "";

      const renderSupplements = (supplements = []) =>
        supplements
          .map(
            (sup, idx) =>
              `${idx ? '<span class="separator">|</span>' : ""}<span>${escapeHtml(sup.label)}: <strong>${escapeHtml(sup.price)}</strong></span>`,
          )
          .join("");

      const renderItem = (item) => {
        const nombre = t(item, "nombre");
        const descripcion = t(item, "descripcion");
        const allergens = getArray(item.alergenos);
        const traces = getArray(item.trazas);

        return `
          <div class="menu-item">
            <div class="item-header">
              <span class="item-name">${escapeHtml(nombre)}</span>
              <span class="item-price">${escapeHtml(item.precio || "")}</span>
            </div>
            ${item.imagen ? `<div class="item-photo"><img src="${escapeHtml(item.imagen)}" alt="${escapeHtml(nombre)}" loading="lazy" /></div>` : ""}
            ${renderAlergenos(allergens)}
            ${
              descripcion || traces.length
                ? `
              <div class="item-description">
                ${escapeHtml(descripcion)}
                ${renderAlergenos(traces, "alergenos-trazas")}
              </div>
            `
                : ""
            }
          </div>
        `;
      };

      const renderSection = (section, isFirst) => {
        const sectionNote = sectionNotes[section.titulo];

        let noteText = "";
        let sups = [];
        if (sectionNote) {
          noteText =
            currentLang === "en" && sectionNote.text_en
              ? sectionNote.text_en
              : sectionNote.text_es || sectionNote.text;
          sups =
            currentLang === "en" && sectionNote.supplements_en
              ? sectionNote.supplements_en
              : sectionNote.supplements_es || sectionNote.supplements;
        }

        const noteHtml = sectionNote
          ? `
          <div class="menu-note">
            <p>${escapeHtml(noteText)}
               ${sectionNote.allergens?.length ? `<span class="alergenos inline-alergenos">${sectionNote.allergens.map((icon) => `<span>${escapeHtml(icon)}</span>`).join("")}</span>` : ""}
            </p>
            ${sups?.length ? `<div class="suplementos">${renderSupplements(sups)}</div>` : ""}
          </div>`
          : "";

        return `
          <section class="menu-section${isFirst ? " active" : ""}">
            <div class="section-header" onclick="toggleSection(this)">
              <h2 class="section-title">${escapeHtml(section.titulo)}</h2>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="section-content">
              <div class="section-content-inner">
                ${noteHtml}
                <div class="menu-grid">
                  ${section.items.map(renderItem).join("")}
                </div>
              </div>
            </div>
          </section>`;
      };

      function renderMenu() {
        if (!menuData.length) return;

        const currentConfig = config[currentLang];

        app.innerHTML = `
          <div class="menu-note top-note">
            <p>${escapeHtml(currentConfig.iva)}</p>
            <p>${escapeHtml(currentConfig.alergenos)}</p>
            <div class="leyenda-alergenos">
              ${legend[currentLang].map(([icon, label]) => `<span><span class="alergeno-icon" data-allergen="${escapeHtml(icon)}">${escapeHtml(icon)}</span> ${escapeHtml(label)}</span>`).join("")}
            </div>
          </div>
          ${menuData.map((section, idx) => renderSection(section, idx === 0)).join("")}
          <footer class="site-footer">
            <div class="footer-content">
              <div class="footer-section">
                <h4>${escapeHtml(currentConfig.ubicacion)}</h4>
                <p><a href="https://maps.google.com/?q=Carrer+de+Tortosa,+1,+12589+Càlig,+Castellón" target="_blank" rel="noopener noreferrer">Carrer de Tortosa, núm. 1 — Càlig</a></p>
                <p><a href="tel:+34964880172" class="phone-link">964 88 01 72</a></p>
              </div>
              <div class="footer-logo">
                <img src="imagenes/Logo Pizzeria.png" alt="Logo Pizzeria Vila de Càlig" loading="lazy" />
              </div>
              <div class="footer-section">
                <h4>${escapeHtml(currentConfig.horarioTitle)}</h4>
                <p>${escapeHtml(currentConfig.horario1)}</p>
                <p>${escapeHtml(currentConfig.horario2)}</p>
              </div>
            </div>
            <div class="footer-bottom">
              <p>© ${new Date().getFullYear()} Pizzeria Vila de Càlig.</p>
            </div>
          </footer>
        `;
      }

      async function loadMenu() {
        try {
          const response = await fetch("carta.xlsx");
          if (!response.ok) throw new Error("No se encontró carta.xlsx");
          const arrayBuffer = await response.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: "array" });

          const sectionsMap = {};
          let firstSheet = true;

          workbook.SheetNames.forEach((sheetName) => {
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
            rows.forEach((row) => {
              const sectionTitle = row.seccion;
              if (!sectionTitle) return;

              if (!sectionsMap[sectionTitle]) {
                sectionsMap[sectionTitle] = {
                  titulo: sectionTitle,
                  items: [],
                  isFirst: firstSheet,
                };
                firstSheet = false;
              }
              sectionsMap[sectionTitle].items.push(row);
            });
          });

          menuData = Object.values(sectionsMap);
          if (menuData.length > 0) menuData[0].isFirst = true;

          renderMenu();
        } catch (error) {
          app.innerHTML = `<p style="color: red; padding: 20px;">Error al cargar la carta: ${error.message}</p>`;
        }
      }

      loadMenu();
    </script>
  </body>
</html>
