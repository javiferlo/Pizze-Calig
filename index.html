<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzeria Vila de Càlig - Carta Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero-header">
      <div class="hero-overlay">
        <img
          class="hero-logo"
          src="imagenes/Logo Pizzeria.png"
          alt="Pizzeria Vila de Càlig"
        />
        <h1>Pizzeria Vila de Càlig</h1>
        <p>La Nostra Carta</p>
      </div>
    </header>

    <main class="container" id="app"></main>

    <script src="xlsx.min.js"></script>
    <script>
      const config = {
        iva: "IVA incluido en los precios.",
        alergenos: "Información adicional de alérgenos preguntar al personal.",
        nombre: "Pizzeria Vila de Càlig",
      };

      const legend = [
        ["🌾", "Gluten"],
        ["🥛", "Lácteos"],
        ["🦐", "Crustáceos"],
        ["🐟", "Pescado"],
        ["🌱", "Soja"],
        ["🥚", "Huevo"],
        ["🦑", "Moluscos"],
        ["🟡", "Mostaza"],
      ];

      const sectionNotes = {
        Pizzas: {
          text: "Todas nuestras pizzas se elaboran con base de tomate, mozzarella y especias.",
          allergens: ["🌾", "🥛"],
          supplements: [
            { label: "Masa sin gluten", price: "+2,00€" },
            { label: "Suplemento ingrediente", price: "+1,20€" },
            { label: "Suplemento Foie / Anchoas", price: "+2,00€" },
          ],
        },
      };

      const app = document.getElementById("app");
      const escapeHtml = (value) =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");

      function toggleSection(headerElement) {
        headerElement.parentElement.classList.toggle("active");
      }

      const renderAlergenos = (icons, className = "alergenos") =>
        `<div class="${className}">${icons
          .map((icon) => `<span>${escapeHtml(icon)}</span>`)
          .join("")}</div>`;

      const renderItem = (item) => {
        const parts = [
          `<div class="menu-item">`,
          `<div class="item-header">`,
          `<span class="item-name">${escapeHtml(item.nombre)}</span>`,
          `<span class="item-price">${escapeHtml(item.precio || "")}</span>`,
          `</div>`,
        ];

        if (item.imagen) {
          parts.push(
            `<div class="item-photo"><img src="${escapeHtml(item.imagen)}" alt="${escapeHtml(item.nombre)}" loading="lazy" /></div>`,
          );
        }

        const allergens = (item.alergenos || "")
          .split(",")
          .map((s) => s.trim())
          .filter((s) => s);
        if (allergens.length) {
          parts.push(renderAlergenos(allergens));
        }

        if (item.descripcion) {
          parts.push(
            `<div class="item-description">${escapeHtml(item.descripcion)}`,
          );
          const traces = (item.trazas || "")
            .split(",")
            .map((s) => s.trim())
            .filter((s) => s);
          if (traces.length) {
            parts.push(renderAlergenos(traces, "alergenos-trazas"));
          }
          parts.push(`</div>`);
        } else {
          const traces = (item.trazas || "")
            .split(",")
            .map((s) => s.trim())
            .filter((s) => s);
          if (traces.length) {
            parts.push(renderAlergenos(traces, "alergenos-trazas"));
          }
        }

        parts.push(`</div>`);
        return parts.join("");
      };

      const renderSupplements = (supplements = []) =>
        supplements
          .map(
            (supplement, index) =>
              `${index ? '<span class="separator">|</span>' : ""}<span>${escapeHtml(supplement.label)}: <strong>${escapeHtml(supplement.price)}</strong></span>`,
          )
          .join("");

      const renderSection = (section, isFirst) => {
        const sectionNote = sectionNotes[section.titulo];
        const note = sectionNote
          ? `<div class="menu-note"><p>${escapeHtml(sectionNote.text)}${sectionNote.allergens?.length ? `<span class="alergenos inline-alergenos">${sectionNote.allergens.map((icon) => `<span>${escapeHtml(icon)}</span>`).join("")}</span>` : ""}</p>${sectionNote.supplements?.length ? `<div class="suplementos">${renderSupplements(sectionNote.supplements)}</div>` : ""}</div>`
          : "";

        return `<section class="menu-section${isFirst ? " active" : ""}">
          <div class="section-header" onclick="toggleSection(this)">
            <h2 class="section-title">${escapeHtml(section.titulo)}</h2>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="section-content">
            <div class="section-content-inner">
              ${note}
              <div class="menu-grid">
                ${section.items.map(renderItem).join("")}
              </div>
            </div>
          </div>
        </section>`;
      };

      async function loadMenu() {
        try {
          const response = await fetch("carta.xlsx");
          if (!response.ok) throw new Error("No se encontró carta.xlsx");
          const arrayBuffer = await response.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: "array" });

          const sections = {};
          let firstSheet = true;

          workbook.SheetNames.forEach((sheetName) => {
            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet);

            rows.forEach((row) => {
              const sectionTitle = row.seccion;
              if (!sectionTitle) return;

              if (!sections[sectionTitle]) {
                sections[sectionTitle] = {
                  titulo: sectionTitle,
                  items: [],
                  isFirst: firstSheet,
                };
                firstSheet = false;
              }
              sections[sectionTitle].items.push(row);
            });
          });

          const sectionsArray = Object.values(sections);
          if (sectionsArray.length > 0 && !sectionsArray[0].isFirst) {
            sectionsArray[0].isFirst = true;
          }

          app.innerHTML = `
            <div class="menu-note top-note">
              <p>${escapeHtml(config.iva)}</p>
              <p>${escapeHtml(config.alergenos)}</p>
              <div class="leyenda-alergenos">
                ${legend
                  .map(
                    ([icon, label]) =>
                      `<span><span class="alergeno-icon">${escapeHtml(icon)}</span> ${escapeHtml(label)}</span>`,
                  )
                  .join("")}
              </div>
            </div>
            ${sectionsArray.map((section, idx) => renderSection(section, idx === 0)).join("")}
            <footer class="site-footer">
              <div class="footer-content">
                <div class="footer-section">
                  <h4>Ubicación y Contacto</h4>
                  <p>
                    <a href="https://maps.google.com/?q=Carrer+de+Tortosa,+1,+12589+Càlig,+Castellón" target="_blank" rel="noopener noreferrer">Carrer de Tortosa, núm. 1 — Càlig</a>
                  </p>
                  <p><a href="tel:+34964880172" class="phone-link">964 88 01 72</a></p>
                </div>

                <div class="footer-logo">
                  <img src="imagenes/Logo Pizzeria.png" alt="Logo Pizzeria Vila de Càlig" loading="lazy" />
                </div>

                <div class="footer-section">
                  <h4>Horario</h4>
                  <p>Jue a Dom: 19:00–22:30 | Vie a Dom: 12:00–15:30</p>
                  <p>Lunes, martes y miércoles: Cerrado</p>
                </div>
              </div>

              <div class="footer-bottom">
                <p>© ${new Date().getFullYear()} Pizzeria Vila de Càlig.</p>
              </div>
            </footer>
          `;
        } catch (error) {
          app.innerHTML = `<p style="color: red; padding: 20px;">Error: ${error.message}</p>`;
        }
      }

      loadMenu();
    </script>
  </body>
</html>
